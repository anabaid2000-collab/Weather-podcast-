name: SkyCast Expo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Check Expo app metadata
        run: node -e "const app=require('./app.json'); if (!app.expo || !app.expo.name) process.exit(1); console.log(app.expo.name + ' metadata OK')"
      - name: Check Expo dependencies and configuration
        run: npx expo-doctor
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
