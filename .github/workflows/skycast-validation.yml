name: SkyCast Expo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
