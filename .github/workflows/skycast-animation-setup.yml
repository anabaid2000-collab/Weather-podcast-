name: Prepare SkyCast animation dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-animation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SkyCast
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install SDK-compatible animation packages
        run: npx expo install react-native-reanimated react-native-worklets
      - name: Verify Expo configuration
        run: npx expo-doctor
      - name: Commit dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Animation dependencies are already up to date."
          else
            git commit -m "Install SDK-compatible Reanimated animation dependencies"
            git push
          fi
