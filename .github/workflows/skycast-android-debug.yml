name: SkyCast standalone Android APK (no Metro, no EAS credentials)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skycast-android-standalone-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build standalone Android APK with bundled JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out SkyCast
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Expo Updates preview channel in standalone APK
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const applicationTag = /<application\\b[^>]*>/;
          if (!applicationTag.test(xml)) throw new Error('Android application tag not found');
          const metadata = '    <meta-data android:name="expo.modules.updates.EXPO_UPDATES_REQUEST_HEADERS" android:value="{&quot;expo-channel-name&quot;:&quot;preview&quot;}"/>\\n';
          if (xml.includes('expo.modules.updates.EXPO_UPDATES_REQUEST_HEADERS')) {
            xml = xml.replace(/\\s*<meta-data android:name="expo\\.modules\\.updates\\.EXPO_UPDATES_REQUEST_HEADERS"[^>]*\\/>/, '\\n' + metadata.trim());
          } else {
            xml = xml.replace(applicationTag, match => match + '\\n' + metadata);
          }
          fs.writeFileSync(file, xml);
          if (!xml.includes('&quot;expo-channel-name&quot;:&quot;preview&quot;')) throw new Error('Preview channel header was not configured');
          NODE

      - name: Explicitly enable JS bundling for debug
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let lines = fs.readFileSync(file, 'utf8').split('\n');
          const start = lines.findIndex(line => /^\s*react\s*\{\s*$/.test(line));
          if (start < 0) throw new Error('React Native Gradle react block not found');
          // Remove only active assignments; leave explanatory commented template lines alone.
          lines = lines.filter((line, index) =>
            index <= start || !/^\s*debuggableVariants\s*=/.test(line)
          );
          const updatedStart = lines.findIndex(line => /^\s*react\s*\{\s*$/.test(line));
          lines.splice(updatedStart + 1, 0,
            '    // Ensure the debug APK contains its JS bundle and needs no Metro server.',
            '    debuggableVariants = []'
          );
          fs.writeFileSync(file, lines.join('\n'));
          const active = fs.readFileSync(file, 'utf8').split('\n')
            .some(line => /^\s*debuggableVariants\s*=\s*\[\s*\]\s*$/.test(line));
          if (!active) throw new Error('Active debuggableVariants = [] setting was not written');
          NODE

      - name: Build standalone debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains the JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/skycast-apk-contents.txt
          grep -E 'assets/.*(index\.android\.bundle|\.bundle\.hbc)' /tmp/skycast-apk-contents.txt

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: skycast-android-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
