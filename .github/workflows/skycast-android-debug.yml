name: SkyCast standalone Android APK (no Metro, no EAS credentials)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skycast-android-standalone-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build standalone Android APK with bundled JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out SkyCast
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Enable JavaScript bundling for the debug variant
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          if (!/react\s*\{/.test(gradle)) {
            throw new Error('Could not find the React Native Gradle react block');
          }
          if (/debuggableVariants\s*=/.test(gradle)) {
            gradle = gradle.replace(/debuggableVariants\s*=\s*\[[^\]]*\]/, 'debuggableVariants = []');
          } else {
            gradle = gradle.replace(/react\s*\{/, match => match + '\n    // Bundle JS into the APK so it runs without Metro.\n    debuggableVariants = []');
          }
          fs.writeFileSync(file, gradle);
          if (!/debuggableVariants\s*=\s*\[\s*\]/.test(gradle)) {
            throw new Error('Failed to enable JS bundling for debug');
          }
          NODE

      - name: Build standalone debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains a JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: skycast-android-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
